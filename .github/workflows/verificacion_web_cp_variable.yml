name: Verificación web cp(T)
on:
  push:
    branches:
      - validacion/fase-2d-web-cp
      - validacion/unificacion-cp-dashboard
      - validacion/fase-2e-cp
      - validacion/fase-2f-cp
      - validacion/fase-2g-cp
      - validacion/revision-educativa-cp
      - mejoras/cp-variable
permissions:
  contents: read
jobs:
  web-cp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias declaradas
        run: python -m pip install -r requirements.txt
      - name: Verificar dashboard único cp(T) y visualización histórica
        run: python -m unittest discover -s tests -p 'test_cp_variable_web.py' -v && python -m unittest discover -s tests -p 'test_web_app.py' -v && python -m unittest discover -s tests -p 'test_dashboard.py' -v
      - name: Verificar sensibilidad OFAT cp(T) y su integración Flask
        run: python -m unittest discover -s tests -p 'test_sensibilidad_cp*.py' -v
      - name: Verificar mapas de diseño cp(T) y la ruta Flask
        run: python -m unittest discover -s tests -p 'test_mapa*cp*.py' -v
      - name: Verificar Segunda Ley cp(T), balances y Flask
        run: python -m unittest discover -s tests -p 'test_segunda_ley_cp*.py' -v
      - name: Verificar contenido educativo, galería SVG y accesibilidad del visor
        run: python -m unittest discover -s tests -p 'test_revision_educativa_cp.py' -v
