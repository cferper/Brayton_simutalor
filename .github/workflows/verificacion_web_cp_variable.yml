name: Verificación web cp(T)
on:
  push:
    branches:
      - validacion/fase-2d-web-cp
      - validacion/unificacion-cp-dashboard
      - validacion/fase-2e-cp
      - validacion/fase-2f-cp
      - validacion/fase-2g-cp
      - validacion/revision-educativa-cp
      - validacion/fundamentos-extensos-cp
      - validacion/graficas-cp-resultados-optimizacion
      - validacion/saneamiento-suite-historica-cp
      - validacion/visual-sensibilidad-cp
      - validacion/visual-mapa-cp
      - validacion/visual-segunda-ley-cp
      - validacion/acoplamiento-turbomaquinaria-cp-34
      - validacion/tobera-cp-variable-35
      - validacion/condiciones-vuelo-cp-36
      - validacion/combustible-tsfc-cp-37
      - validacion/mapas-prestaciones-cp-38
      - mejoras/cp-variable
permissions:
  contents: read
jobs:
  web-cp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias declaradas
        run: python -m pip install -r requirements.txt
      - name: Verificar dashboard único cp(T) y visualización histórica
        run: python -m unittest discover -s tests -p 'test_cp_variable_web.py' -v && python -m unittest discover -s tests -p 'test_web_app.py' -v && python -m unittest discover -s tests -p 'test_dashboard.py' -v
      - name: Verificar sensibilidad OFAT cp(T) y su integración Flask
        run: python -m unittest discover -s tests -p 'test_sensibilidad_cp*.py' -v
      - name: Verificar mapas de diseño cp(T) y la ruta Flask
        run: python -m unittest discover -s tests -p 'test_mapa*cp*.py' -v
      - name: Verificar Segunda Ley cp(T), balances y Flask
        run: python -m unittest discover -s tests -p 'test_segunda_ley_cp*.py' -v
      - name: Verificar contenido educativo, galería SVG y accesibilidad del visor
        run: python -m unittest discover -s tests -p 'test_revision_educativa_cp.py' -v
      - name: Verificar nuevas gráficas de Resultados y Optimización cp(T)
        run: python -m unittest discover -s tests -p 'test_graficas_cp_variable.py' -v
      - name: Verificar representaciones OFAT ampliadas (milestone 31)
        run: python -m unittest discover -s tests -p 'test_graficas_sensibilidad_31.py' -v
      - name: Verificar mapas categóricos y cortes (milestone 32)
        run: python -m unittest discover -s tests -p 'test_graficas_mapa_32.py' -v
      - name: Verificar gráficos de entropía y exergía (milestone 33)
        run: python -m unittest discover -s tests -p 'test_graficas_segunda_ley_33.py' -v
      - name: Verificar acoplamiento de turbomáquinas (milestone 34)
        run: python -m unittest discover -s tests -p 'test_acoplamiento_turbomaquinaria_34.py' -v
      - name: Verificar tobera convergente y empuje específico (milestone 35)
        run: python -m unittest discover -s tests -p 'test_tobera_cp_variable_35.py' -v
      - name: Verificar atmósfera, difusor y empuje neto (milestone 36)
        run: python -m unittest discover -s tests -p 'test_vuelo_cp_variable_36.py' -v
      - name: Verificar combustible, nuevo eje y TSFC (milestone 37)
        run: python -m unittest discover -s tests -p 'test_combustible_cp_variable_37.py' -v
      - name: Verificar barridos termodinámicos y frente de Pareto (milestone 38)
        run: python -m unittest discover -s tests -p 'test_mapas_prestaciones_turborreactor_38.py' -v
      - name: Verificar suite completa vigente y compatibilidad científica histórica
        run: python -m unittest discover -s tests -q
